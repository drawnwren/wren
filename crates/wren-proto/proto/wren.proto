syntax = "proto3";

package wren.protocol.v1;

// Frozen control-plane envelope for protocol major version 1. Unknown fields
// remain forward-compatible; incompatible semantics require a new major.
message Envelope {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof payload {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    ClientMutation client_mutation = 12;
    MutationResult mutation_result = 13;
    SessionEvent session_event = 14;
    Resume resume = 15;
    ResumeResult resume_result = 16;
    SaveRequest save_request = 17;
    Saved saved = 18;
    OpenDocument open_document = 19;
    DocumentOpened document_opened = 20;
    RemoteCall remote_call = 21;
    RemoteReply remote_reply = 22;
  }
}
message RemoteCall { bytes body = 1; }
message RemoteReply { bytes body = 1; }
message OpenDocument { uint64 document_id = 1; uint64 client_id = 2; string text = 3; }
message DocumentOpened { uint64 document_id = 1; uint64 revision = 2; uint64 lease_epoch = 3; uint64 session_epoch = 4; }

message Hello { uint32 major = 1; uint32 minor = 2; repeated string capabilities = 3; uint64 max_frame_bytes = 4; }
message HelloAck { uint32 major = 1; uint32 minor = 2; repeated string capabilities = 3; uint64 max_frame_bytes = 4; }
message Edit { uint64 start = 1; uint64 end = 2; string insert = 3; }
message Transaction { uint64 base_revision = 1; repeated Edit edits = 2; }
message RegisterDelta { string name = 1; string text = 2; bool linewise = 3; }
message GlobalMarkDelta { string name = 1; uint64 document_id = 2; uint64 byte = 3; bool right_bias = 4; }
message UndoBranchDelta { uint64 document_id = 1; optional uint64 semantic_group_id = 2; }
message MacroRecordingDelta { string name = 1; bytes raw_keys = 2; bytes lowered_ir = 3; }
message DurableJumpEntry { uint64 document_id = 1; uint64 byte = 2; bool right_bias = 3; optional string path_hint = 4; }
message JumpListDelta { repeated DurableJumpEntry entries = 1; optional uint64 current = 2; }
message StateDelta {
  oneof value {
    RegisterDelta register = 1;
    string search_pattern = 2;
    string command_history = 3;
    GlobalMarkDelta global_mark = 4;
    UndoBranchDelta undo_branch = 5;
    bytes repeat_data = 6;
    MacroRecordingDelta macro_recording = 7;
    JumpListDelta jump_list = 8;
  }
}
enum SemanticGroupKind { INSERT_RUN = 0; OPERATOR = 1; MACRO_INVOCATION = 2; FORMATTER = 3; WORKSPACE_REFACTOR = 4; UNDO_OF = 5; REDO_OF = 6; }
message DocumentMutation { uint64 document_id = 1; uint64 lease_epoch = 2; uint64 base_revision = 3; uint64 semantic_group_id = 4; SemanticGroupKind semantic_group_kind = 5; optional uint64 related_group_id = 6; optional uint64 undo_parent = 7; repeated Transaction transactions = 8; }
message ClientMutation { uint64 mutation_id = 1; uint64 client_id = 2; uint64 client_sequence = 3; repeated StateDelta state_deltas = 4; repeated DocumentMutation documents = 5; }
message AcceptedDocument { uint64 document_id = 1; uint64 accepted_revision = 2; bytes canonical_transaction_hash = 3; }
message Received { uint64 mutation_id = 1; }
message Durable { uint64 mutation_id = 1; uint64 client_sequence = 2; uint64 session_sequence = 3; repeated AcceptedDocument documents = 4; }
message RebaseRequired { uint64 mutation_id = 1; uint64 document_id = 2; uint64 authoritative_revision = 3; repeated Transaction delta_since_base = 4; }
message LeaseLost { uint64 document_id = 1; uint64 current_lease_epoch = 2; }
message Conflict { uint64 document_id = 1; string reason = 2; }
message MutationResult { oneof value { Received received = 1; Durable durable = 2; RebaseRequired rebase_required = 3; LeaseLost lease_lost = 4; Conflict conflict = 5; } }
enum OfflinePolicy { DENY_EDITS = 0; LOCAL_BRANCH = 1; }
message LeaseGrant { uint64 document_id = 1; uint64 lease_epoch = 2; uint64 holder_id = 3; OfflinePolicy offline_policy = 4; }
enum EventOriginKind { CLIENT = 0; WORKSPACE = 1; RECOVERY = 2; }
message EventOrigin { EventOriginKind kind = 1; optional uint64 client_id = 2; }
message DocumentDelta { uint64 document_id = 1; uint64 accepted_revision = 2; repeated Transaction transactions = 3; }
message ExternalChange { uint64 document_id = 1; bytes content_hash = 2; }
message SessionEventPayload { oneof value { DocumentDelta document_delta = 1; StateDelta state_delta = 2; LeaseGrant lease_change = 3; ExternalChange external_change = 4; } }
message SessionEvent { uint64 session_sequence = 1; EventOrigin origin = 2; SessionEventPayload payload = 3; }
message DocumentFrontier { uint64 document_id = 1; uint64 revision = 2; }
message Resume { uint64 session_id = 1; uint64 session_epoch = 2; uint64 last_session_sequence = 3; repeated DocumentFrontier document_frontiers = 4; repeated uint64 outstanding_mutation_ids = 5; }
message Replay { repeated SessionEvent events = 1; }
message SnapshotRequired { uint64 new_session_epoch = 1; uint64 workspace_generation = 2; repeated DocumentFrontier document_heads = 3; }
message ResumeResult { oneof value { Replay replay = 1; SnapshotRequired snapshot_required = 2; } }
message FileIdentity { uint64 device = 1; uint64 file = 2; uint64 generation = 3; }
message SaveRequest { uint64 document_id = 1; uint64 required_frontier = 2; FileIdentity expected_file_identity = 3; bytes expected_content_hash = 4; }
message Saved { uint64 document_id = 1; uint64 persisted_frontier = 2; FileIdentity new_file_identity = 3; bytes new_content_hash = 4; }
