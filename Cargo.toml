[workspace]
resolver = "2"
members = ["crates/*", "harness/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/wren"

[workspace.dependencies]
ropey = "1"
crop = "0.4"
imara-diff = "0.2"
merge3 = { version = "0.2.1", default-features = false }
ls-types = "0.0.6"
mmap-io = { version = "1", features = ["atomic"] }
parking_lot = "0.12"
rayon = "1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSThread", "NSObjCRuntime"] }
ast-grep-core = "0.45"
ast-grep-language = "0.45"
tree-sitter = "0.26"
portable-pty = "0.9"
pollster = "1"
qos-threads = "0.1.3"
vt100 = "0.16.2"
nix = { version = "0.28", features = ["fs", "mman", "process", "resource", "signal"] }
xattr = "1"
filetime = "0.2"
fastcdc = "4.0.1"
nucleo-matcher = "0.3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"
prost = "0.14.4"
regex = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
anyhow = "1"
base64 = "0.22"
flate2 = "1"
glam = "0.30"
bitflags = { version = "2", features = ["serde"] }
blake3 = "1"
compact_str = { version = "0.10", features = ["serde"] }
catppuccin = "2.8"
cel-interpreter = { version = "0.10", default-features = false }
core_affinity = "0.8"
dhat = "0.3"
rmpv = { version = "1", features = ["with-serde"] }
serde_json = { version = "1", features = ["raw_value"] }
smallvec = "1"
tempfile = "3"
termina = "0.3.3"
rustix = { version = "1", features = ["fs"] }
toml = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
wgpu = "30"
wasmtime = { version = "47.0.3", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "wat"] }
wit-parser = "0.252.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
branches_sharing_code = "warn"
cognitive_complexity = "warn"
match_same_arms = "warn"

[profile.release]
lto = "thin"
